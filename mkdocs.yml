site_name: CFMS on WebSocket Server-side Documentation
repo_url: https://github.com/cfms-dev/cfms_on_websocket.git

theme:
  name: material
  language: zh
  palette:
    # light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗黑模式
    # dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  features:
    - navigation.tabs
    - search.suggest
    - content.code.copy
    - content.code.annotate
    - content.code.select

nav:
  - 首页: index.md
  - 在开始之前:
    - CFMS 不是什么: what-cfms-is-not.md
  - 快速开始: getting-started.md
  - 配置文件: configuration.md
  - 功能: 
    - 概览: features/index.md
    - 文档管理与文件传输: features/document-management.md
    - 修订版本: features/revisions.md
    - 对象访问控制: features/object-access-control.md
    - 密钥环: features/keyrings.md
    - 锁定模式: features/lockdown.md
    - 身份验证与安全管理: features/security-controls.md
    - 请求速率控制: features/rate-limiting.md
  - 扩展: extensions.md
  - 部署与维护: maintenance.md
  - 高级主题:
    - 数据库设计限制: advanced/database-limits.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
